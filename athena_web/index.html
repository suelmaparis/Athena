<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Athena SOS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .container {
      padding: 20px;
    }

    #map {
      height: 250px;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }

    .sos-button {
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 150px;
      height: 150px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 30px;
      box-shadow: 0 0 30px rgba(255,0,0,0.6);
      cursor: pointer;
    }

    .sos-button:active {
      transform: scale(0.95);
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }

    .alerts {
      margin-top: 30px;
      text-align: left;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }

    .alerts h2 {
      margin-top: 0;
    }

    .alerts li {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <h1>🚨 Athena</h1>
 
  <input id="username" placeholder="Enter your name" />
  
  <button onclick="register()">Sign up</button>
  <button onclick="login()">Login</button>
  <div class="container">
    <button class="sos-button" onclick="sendSOS()">SOS</button>

    <p id="status"></p>

    <div id="map"></div>

    <div class="alerts">
      <h2>Alertas enviados</h2>
      <ul id="alerts"></ul>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    let map;
    let marker;
  
    // 🔐 user session
    let currentUser = null;
  
    // 🚀 SEND SOS
    async function sendSOS() {
      const status = document.getElementById("status");
  
      // 🔥 require login
      if (!currentUser) {
        status.innerText = "Please login first";
        return;
      }
  
      status.innerText = "Getting location...";
  
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
  
        // 🗺️ create map
        if (!map) {
          map = L.map('map').setView([lat, lon], 13);
  
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data © OpenStreetMap'
          }).addTo(map);
  
          // ⚠️ danger zone
          L.circle([40.7128, -74.0060], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.3,
            radius: 1000
          }).addTo(map);
        }
  
        // 📍 marker
        if (marker) {
          marker.setLatLng([lat, lon]);
        } else {
          marker = L.marker([lat, lon]).addTo(map);
        }
  
        status.innerText = "Sending SOS...";
  
        try {
          await fetch("http://localhost:8000/sos", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              latitude: lat,
              longitude: lon,
              username: currentUser
            })
          });
  
          status.innerText = "SOS sent 🚨";
  
          loadAlerts();
  
        } catch (error) {
          status.innerText = "Error sending request";
          console.error(error);
        }
  
      }, () => {
        status.innerText = "Location permission denied";
      });
    }
  
    // 📦 LOAD ALERTS
    async function loadAlerts() {
      try {
        const response = await fetch("http://localhost:8000/alerts");
        const data = await response.json();
  
        const list = document.getElementById("alerts");
        list.innerHTML = "";
  
        data.forEach(item => {
          const li = document.createElement("li");
          li.innerText = `📍 ${item.latitude.toFixed(4)}, ${item.longitude.toFixed(4)} - ${item.user}`;
          list.appendChild(li);
        });
  
      } catch (error) {
        console.error("Error loading alerts:", error);
      }
    }
  
    // 📝 REGISTER
    async function register() {
      const username = document.getElementById("username").value;
  
      if (!username) {
        alert("Enter a username");
        return;
      }
  
      const response = await fetch("http://localhost:8000/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username })
      });
  
      const data = await response.json();
      alert(data.message);
    }
  
    // 🔑 LOGIN
    async function login() {
      const username = document.getElementById("username").value;
  
      if (!username) {
        alert("Enter a username");
        return;
      }
  
      const response = await fetch("http://localhost:8000/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username })
      });
  
      const data = await response.json();
  
      if (data.message === "Login successful") {
        currentUser = username;
        alert("Login successful ✅");
      } else {
        alert("User not found ❌");
      }
    }
  
    // 🔄 LOAD ON START
    window.onload = loadAlerts;
  </script>
</body>
</html>
